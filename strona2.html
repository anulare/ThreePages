<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Podstrona 2 - Formularz</title>
</head>
<body>

    <p><a href="index.html">cofnij</a></p>

    <table width="500" align="center">
        <tr>
            <td>
                <form action="#" method="post">
                    
                    <table border="0" width="100%" cellpadding="5">
                        <tr>
                            <td align="right" width="30%"><b><label for="imie">imię</label></b></td>
                            <td width="70%"><input type="text" id="imie" name="imie" size="30" required></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="nazwisko">nazwisko</label></b></td>
                            <td><input type="text" id="nazwisko" name="nazwisko" size="30" required></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="ulica">ulica</label></b></td>
                            <td><input type="text" id="ulica" name="ulica" size="30"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="miasto">miasto</label></b></td>
                            <td><input type="text" id="miasto" name="miasto" size="30"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="haslo">hasło</label></b></td>
                            <td><input type="password" id="haslo" name="haslo" size="30" required></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="data_urodzenia">data urodzenia</label></b></td>
                            <td><input type="date" id="data_urodzenia" name="data_urodzenia"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="telefon">telefon</label></b></td>
                            <td><input type="tel" id="telefon" name="telefon" size="30"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="wojewodztwo">województwo</label></b></td>
                            <td><input type="text" id="wojewodztwo" name="wojewodztwo" size="30"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><label for="email">email</label></b></td>
                            <td><input type="email" id="email" name="email" size="30" required></td>
                        </tr>
                        <tr>
                            <td align="right" valign="top"><b><label for="uwagi">uwagi</label></b></td>
                            <td><textarea id="uwagi" name="uwagi"></textarea></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" id="prawo_jazdy" name="prawo_jazdy">
                                <label for="prawo_jazdy">prawo jazdy</label>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <br>
                                <input type="submit" value="Wyślij">
                            </td>
                        </tr>
                    </table>

                </form>
            </td>
        </tr>
    </table>

</body>
</html>
