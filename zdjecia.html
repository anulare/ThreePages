<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zdjęcia</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 15px;
        }

        /* Styl dla linku powrotnego wyrównanego do lewej */
        .back-link {
            text-align: left;
        }

        .back-link a {
            color: blue;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        h1 {
            margin-top: 10px;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center; /* Wyśrodkowanie w pionie */
            justify-items: center; /* Wyśrodkowanie w poziomie */
        }

        .gallery-item {
            text-align: center;
        }

        .gallery-item img {
            max-width: 100%;
            height: auto;
            border: 2px solid black;
            display: block; /* Usuwa domyślny margines pod obrazkiem */
        }

        .gallery-item p {
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Link do powrotu w lewym górnym rogu -->
    <div class="back-link">
        <p><a href="index.html">cofnij</a></p>
    </div>

    <h1>Zdjęcia</h1>

    <div class="gallery-container">
        <div class="gallery-item">
            <img src="smoky-mountains.jpg" alt="Obrazek 1" style="width: 150px;">
            <p>Podpis 1</p>
        </div>
        <div class="gallery-item">
            <img src="rose.jpg" alt="Obrazek 2" style="width: 300px;">
            <p>Podpis 2</p>
        </div>
        <div class="gallery-item">
            <img src="paris.webp" alt="Obrazek 3" style="width: 200px;">
            <p>Podpis 3</p>
        </div>
        <div class="gallery-item">
            <img src="max.jfif" alt="Obrazek 4" style="width: 150px;">
            <p>Podpis 4</p>
        </div>
        <div class="gallery-item">
            <img src="lis.jfif" alt="Obrazek 5" style="width: 250px;">
            <p>Podpis 5</p>
        </div>
        <div class="gallery-item">
            <img src="juan.jpg" alt="Obrazek 6" style="width: 200px;">
            <p>Podpis 6</p>
        </div>
        <div class="gallery-item">
            <img src="hamter.jpg" alt="Obrazek 7" style="width: 150px;">
            <p>Podpis 7</p>
        </div>
        <div class="gallery-item">
            <img src="creationOfAdam.webp" alt="Obrazek 8" style="width: 300px;">
            <p>Podpis 8</p>
        </div>
        <div class="gallery-item">
            <img src="catInDisbelief.png" alt="Obrazek 9" style="width: 200px;">
            <p>Podpis 9</p>
        </div>
    </div>

</body>
</html>
